name: Build and publish standalone video worker

on:
  push:
    branches:
      - feat/video-worker-ferdowsi-standalone
    paths:
      - "video-worker/**"
      - ".github/workflows/video-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lokal-video-worker-image
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/lokal-ai-video-worker" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: video-worker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:branch-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=lokal-video-worker
          cache-to: type=gha,mode=max,scope=lokal-video-worker
