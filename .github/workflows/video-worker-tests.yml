name: Standalone Video Worker Tests

on:
  push:
    branches:
      - feat/video-worker-ferdowsi-standalone
    paths:
      - "video-worker/**"
      - "supabase/migrations/**"
      - "supabase/functions/video-api/**"
      - ".github/workflows/video-worker-tests.yml"
  pull_request:
    paths:
      - "video-worker/**"
      - "supabase/migrations/**"
      - "supabase/functions/video-api/**"
      - ".github/workflows/video-worker-tests.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    name: Validate standalone worker without GPU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: video_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d video_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: video_queue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile worker source
        run: python -m compileall -q video-worker
      - name: Run contract tests
        run: python -m unittest discover -s video-worker/tests -v
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase database dependencies
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE SCHEMA storage;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $auth$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $auth$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          CREATE TABLE storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL,
            public boolean NOT NULL DEFAULT false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          CREATE TABLE public.armex_wallets (
            user_id uuid PRIMARY KEY,
            balance bigint NOT NULL DEFAULT 0 CHECK (balance >= 0)
          );
          CREATE TABLE public.armex_credit_transactions (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL,
            amount bigint NOT NULL,
            transaction_type text NOT NULL,
            idempotency_key text NOT NULL UNIQUE,
            description text,
            metadata jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE FUNCTION public.armex_debit_credits(
            p_user_id uuid, p_amount bigint, p_idempotency_key text,
            p_description text DEFAULT NULL, p_metadata jsonb DEFAULT '{}'::jsonb
          ) RETURNS boolean
          LANGUAGE plpgsql AS $debit$
          DECLARE v_balance bigint;
          BEGIN
            INSERT INTO public.armex_wallets(user_id) VALUES (p_user_id)
              ON CONFLICT (user_id) DO NOTHING;
            SELECT balance INTO v_balance FROM public.armex_wallets
              WHERE user_id = p_user_id FOR UPDATE;
            IF EXISTS (SELECT 1 FROM public.armex_credit_transactions
              WHERE user_id = p_user_id AND idempotency_key = p_idempotency_key) THEN
              RETURN true;
            END IF;
            IF v_balance < p_amount THEN RETURN false; END IF;
            UPDATE public.armex_wallets SET balance = balance - p_amount
              WHERE user_id = p_user_id;
            INSERT INTO public.armex_credit_transactions(
              user_id, amount, transaction_type, idempotency_key, description, metadata
            ) VALUES (p_user_id, -p_amount, 'usage', p_idempotency_key, p_description,
              coalesce(p_metadata, '{}'::jsonb));
            RETURN true;
          END;
          $debit$;
          CREATE FUNCTION public.armex_grant_credits(
            p_user_id uuid, p_amount bigint, p_type text, p_idempotency_key text,
            p_description text DEFAULT NULL, p_metadata jsonb DEFAULT '{}'::jsonb
          ) RETURNS boolean
          LANGUAGE plpgsql AS $grant$
          BEGIN
            IF EXISTS (SELECT 1 FROM public.armex_credit_transactions
              WHERE user_id = p_user_id AND idempotency_key = p_idempotency_key) THEN
              RETURN true;
            END IF;
            UPDATE public.armex_wallets SET balance = balance + p_amount
              WHERE user_id = p_user_id;
            INSERT INTO public.armex_credit_transactions(
              user_id, amount, transaction_type, idempotency_key, description, metadata
            ) VALUES (p_user_id, p_amount, p_type, p_idempotency_key, p_description,
              coalesce(p_metadata, '{}'::jsonb));
            RETURN true;
          END;
          $grant$;
          SQL
      - name: Apply Video queue migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114150000_lokal_video_queue.sql
      - name: Exercise queue, billing, and lease lifecycle SQL
        run: psql -v ON_ERROR_STOP=1 -f video-worker/tests/sql/test_video_queue.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Video API Edge Function
        run: deno check supabase/functions/video-api/index.ts
