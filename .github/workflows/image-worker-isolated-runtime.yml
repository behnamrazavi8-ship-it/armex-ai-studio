name: Image worker isolated runtime smoke test

on:
  push:
    branches:
      - fix/medium-worker-image-edit-only
    paths:
      - "worker/**"
      - "Dockerfile"
      - ".github/workflows/image-worker-isolated-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Build worker container
        run: docker build --pull -t lokal-ai-image-worker:smoke .

      - name: Start mock Supabase API
        run: |
          cat > /tmp/mock-supabase.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  if length:
                      self.rfile.read(length)
                  body = b"null"
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *_):
                  pass
          HTTPServer(("0.0.0.0", 18787), Handler).serve_forever()
          PY
          nohup python3 -u /tmp/mock-supabase.py >/tmp/mock-supabase.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS -X POST http://127.0.0.1:18787/rest/v1/rpc/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Mock Supabase did not start"
          exit 1

      - name: Run isolated worker and verify health endpoint
        run: |
          set -eu
          cleanup() {
            docker logs lokal-ai-worker-smoke 2>/dev/null || true
            docker rm -f lokal-ai-worker-smoke 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run -d --name lokal-ai-worker-smoke \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:18788:8080 \
            -e SUPABASE_URL=http://host.docker.internal:18787 \
            -e SUPABASE_SECRET_KEY=sb_secret_isolated_smoke_only \
            -e CLOUDFLARE_ACCOUNT_ID=isolated-smoke-account \
            -e CLOUDFLARE_API_TOKEN=isolated-smoke-token \
            -e WORKER_POLL_MS=1000 \
            lokal-ai-image-worker:smoke
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18788/health >/tmp/worker-health.json; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Worker health endpoint did not become ready"
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("/tmp/worker-health.json", encoding="utf-8") as f:
              health = json.load(f)
          assert health.get("service") == "lokal-ai-image-worker", health
          assert health.get("status") == "ok", health
          assert health.get("active_job") is False, health
          print("Isolated worker runtime health check passed")
          PY
