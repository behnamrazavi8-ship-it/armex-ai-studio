name: Prompt IR contract tests

on:
  pull_request:
    paths:
      - "prompt-intelligence/**"
      - ".github/workflows/prompt-ir-tests.yml"
  push:
    branches:
      - "feat/universal-prompt-intelligence"
    paths:
      - "prompt-intelligence/**"
      - ".github/workflows/prompt-ir-tests.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Semantic Prompt IR contract
        run: node --test prompt-intelligence/validate-ir.test.mjs
      - name: Parse JSON Schema and evaluation cases
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('prompt-intelligence/semantic-prompt-ir.schema.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('prompt-intelligence/evaluation-cases.v1.json', 'utf8'))"
