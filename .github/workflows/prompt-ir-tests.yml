name: Prompt IR contract tests

on:
  pull_request:
    paths:
      - "index.html"
      - "prompt-intelligence/**"
      - "supabase/functions/prompt-understanding/**"
      - ".github/workflows/prompt-ir-tests.yml"
  push:
    branches:
      - "feat/universal-prompt-intelligence"
      - "feat/staging-semantic-ir-image-pipeline"
    paths:
      - "index.html"
      - "prompt-intelligence/**"
      - ".github/workflows/prompt-ir-tests.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Semantic Prompt IR contract
        run: node --test prompt-intelligence/validate-ir.test.mjs prompt-intelligence/render-image-prompt.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Staging Edge Function
        run: deno check --no-lock supabase/functions/prompt-understanding/index.ts
      - name: Check Image Studio inline module syntax
        run: |
          node -e "const fs=require('node:fs'); const html=fs.readFileSync('index.html','utf8'); const matches=[...html.matchAll(/<script type=\"module\">([\\s\\S]*?)<\\/script>/g)]; if(matches.length!==1) throw new Error('Expected one inline module script'); fs.writeFileSync('/tmp/lokal-index-module.mjs',matches[0][1]);"
          node --check /tmp/lokal-index-module.mjs
      - name: Parse JSON Schema and evaluation cases
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('prompt-intelligence/semantic-prompt-ir.schema.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('prompt-intelligence/evaluation-cases.v1.json', 'utf8'))"
