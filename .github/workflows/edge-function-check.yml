name: Edge Function and frontend checks

on:
  pull_request:
    paths:
      - "index.html"
      - ".github/workflows/edge-function-check.yml"
      - "supabase/functions/armex-api/**"
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/edge-function-check.yml"
      - "supabase/functions/armex-api/**"

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check armex-api
        run: deno check supabase/functions/armex-api/index.ts

      - name: Test chat request billing lifecycle
        run: deno test supabase/functions/armex-api/chat-request-lifecycle_test.ts

      - name: Test chat request reconciliation policy
        run: deno test supabase/functions/armex-api/chat-request-reconciliation_test.ts

      - name: Syntax-check browser JavaScript
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script([^>]*)>(.*?)</script>", html, re.S | re.I)
          index = 0
          for attrs, source in blocks:
              if not source.strip():
                  continue
              is_module = 'type="module"' in attrs.lower()
              suffix = "mjs" if is_module else "js"
              pathlib.Path(f"/tmp/lokal-inline-{index}.{suffix}").write_text(source, encoding="utf-8")
              index += 1
          if index != 2:
              raise SystemExit(f"Expected 2 inline scripts, found {index}")
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML ids: " + ", ".join(duplicates))
          required = [
              "public-site", "workspace-app", "auth-email", "auth-password",
              "auth-signin", "auth-signup", "auth-reset", "auth-signout",
              "generatePrompt", "generateAIPrompt", "promptResult",
              "creditCount", "walletStat", "page-home", "page-prompt",
              "page-projects", "page-account"
          ]
          missing = [item for item in required if item not in ids]
          if missing:
              raise SystemExit("Missing required UI ids: " + ", ".join(missing))
          PY
          node --check /tmp/lokal-inline-0.js
          node --check /tmp/lokal-inline-1.mjs
