name: Edge Function checks

on:
  pull_request:
    paths:
      - "supabase/functions/armex-api/**"
  push:
    branches: [main]
    paths:
      - "supabase/functions/armex-api/**"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check armex-api
        run: deno check supabase/functions/armex-api/index.ts
