name: Edge Function and frontend checks

on:
  pull_request:
    paths:
      - "index.html"
      - "modules/chat/**"
      - "tests/chat-image-edit-intent.test.mjs"
      - ".github/workflows/edge-function-check.yml"
      - "supabase/functions/armex-api/**"
      - "supabase/functions/alpha-video-worker/**"
      - "modules/video/**"
      - "docs/alpha-video/**"
      - "tests/alpha-video-contract.test.mjs"
      - "tests/chat-image-edit-intent.test.mjs"
      - "supabase/staging/**"
      - "supabase/migrations/**"
  push:
    branches: [main, feat/alpha-video-provider]
    paths:
      - "index.html"
      - "modules/chat/**"
      - "modules/video/**"
      - "tests/alpha-video-contract.test.mjs"
      - "tests/chat-image-edit-intent.test.mjs"
      - ".github/workflows/edge-function-check.yml"
      - "supabase/functions/armex-api/**"
      - "supabase/functions/alpha-video-worker/**"
      - "docs/alpha-video/**"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify chat history API contract
        run: |
          python - <<'PY'
          from pathlib import Path
          api = Path("supabase/functions/armex-api/index.ts").read_text(encoding="utf-8")
          for contract in ['action") === "conversations"', 'action") === "conversation"', 'eq("user_id", userId)', 'eq("conversation_id", conversationId)']:
              if contract not in api:
                  raise SystemExit("Missing chat API contract: " + contract)
          PY

      # Guard the private upload, byte verification, owner scoping, and multimodal image path.
      - name: Verify private chat media security contract
        run: |
          python - <<'PY'
          from pathlib import Path
          api = Path("supabase/functions/armex-api/index.ts").read_text(encoding="utf-8")
          migration = Path("supabase/migrations/20261115000000_lokal_chat_media.sql").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")
          chat = Path("modules/chat/chat.js").read_text(encoding="utf-8")
          checks = {
              "signed upload endpoint": "create_media_upload",
              "upload finalization endpoint": "complete_media_upload",
              "server-side media signature validation": "hasValidMediaSignature",
              "owner-scoped attachment lookup": '.eq("user_id", userId)',
              "private bucket": "public = false",
              "attachment RLS enabled": "enable row level security",
              "video size limit": "CHAT_MEDIA_MAX_VIDEO_BYTES",
              "image attachment to multimodal model": "image_url: { url: imageSignedUrl }",
              "signed browser upload": "uploadToSignedUrl",
          }
          sources = {"api": api, "migration": migration, "html": html, "chat module": chat}
          for label, token in checks.items():
              if not any(token in source for source in sources.values()):
                  raise SystemExit("Missing media security contract: " + label)
          PY

      - name: Verify Staging Prompt Intelligence image bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          fn = Path("supabase/staging/functions/prompt-understanding/index.ts").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")
          config = Path("lokal-config.js").read_text(encoding="utf-8")
          checks = {
              "Production token verification": "verifyProductionUser",
              "Staging quota only": "consume_prompt_intelligence_quota",
              "base64 image input": "image_base64",
              "multimodal signed image URLs": "imageUrls.map((url)",
              "signed URL host restriction": "znendbwkmcldttugvwnr.supabase.co",
              "private chat bucket restriction": "lokal-chat-media",
              "frontend Staging endpoint": "config.promptIntelligenceUrl",
              "Staging public key": "promptIntelligenceAnonKey",
              "no Production prompt endpoint": "config.supabaseUrl.replace" not in html[html.find('window.addEventListener("lokal:generate-ai-prompt"'):],
              "no wallet charge after analysis": "از اعتبار کیف پول مصرف نشد" in html,
              "Staging project URL": "https://pismnyrbbdrreugpxjcj.supabase.co" in config,
          }
          for label, valid in checks.items():
              if not valid:
                  raise SystemExit("Missing Staging image bridge contract: " + label)
          PY

      - name: Type-check Staging Prompt Intelligence
        run: deno check supabase/staging/functions/prompt-understanding/index.ts

      - name: Type-check armex-api and Alpha video worker
        run: |
          deno check supabase/functions/armex-api/index.ts
          deno check supabase/functions/alpha-video-worker/index.ts

      - name: Test Smart Chat image-edit intent
        run: node --test tests/chat-image-edit-intent.test.mjs
      - name: Test Alpha Wan 2.2 integration contracts
        run: node --test tests/alpha-video-contract.test.mjs
      - name: Syntax-check Smart Chat modules
        run: |
          node --input-type=module --check < modules/chat/chat.js
          node --input-type=module --check < modules/chat/image-edit-intent.mjs
          node --input-type=module --check < modules/video/video-studio.js
          node --input-type=module --check < modules/image-editor/image-editor.js

      - name: Syntax-check browser JavaScript
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script([^>]*)>(.*?)</script>", html, re.S | re.I)
          index = 0
          for attrs, source in blocks:
              if not source.strip():
                  continue
              is_module = 'type="module"' in attrs.lower()
              suffix = "mjs" if is_module else "js"
              pathlib.Path(f"/tmp/lokal-inline-{index}.{suffix}").write_text(source, encoding="utf-8")
              index += 1
          if index != 2:
              raise SystemExit(f"Expected 2 inline scripts, found {index}")
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML ids: " + ", ".join(duplicates))
          required = [
              "public-site", "workspace-app", "auth-email", "auth-password",
              "auth-signin", "auth-signup", "auth-reset", "auth-signout",
              "generatePrompt", "generateAIPrompt", "promptResult",
              "creditCount", "walletStat", "page-home", "page-prompt",
              "page-projects", "page-account", "page-chat", "chat-list", "chat-messages", "chat-input", "chat-send", "chat-media-input", "chat-file-note"
          ]
          missing = [item for item in required if item not in ids]
          if missing:
              raise SystemExit("Missing required UI ids: " + ", ".join(missing))
          PY
          node --check /tmp/lokal-inline-0.js
          node --check /tmp/lokal-inline-1.mjs
# verify Alpha migration integrity
# verify Alpha pre-submit failure handling
