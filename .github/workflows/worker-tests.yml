name: Worker unit tests

on:
  push:
    branches:
      - fix/lokal-image-prompt-quality
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"

permissions:
  contents: read

jobs:
  worker-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker unit tests
        working-directory: worker
        run: npm test
